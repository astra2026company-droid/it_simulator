<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Simulator</title>
<script src="/sdk.js"></script>
<style>
:root {
    box-sizing: border-box;
    --case: #d9d2bf;
    --dk: #2b2a33;
    --scr: #1d2b6e;
    --scr2: #2d41a3;
    --txt: #e9f0ff;
    --ink: #e9f0ff;
    --inkd: #e9f0ff;
    --deep: #10184a;
    --scr3: #17216b;
    --btn: #2a3a8c;
    --gold: #f6d23c;
    --onGold: #2b2a33;
    --mint: #7be39a;
    --xp: #ffd76a;
    --red: #ff8a80;
    --mintd: #7be39a;
    --xpd: #ffd76a;
    --redd: #ff8a80;
    --mut: #b4c2f2;
    --mut2: #c9d6ff;
    --bd: #000;
    --bd2: #0b1138;
    --padA: #243586;
    --wbtn: #e9f0ff;
    --fb: system-ui,-apple-system,sans-serif;
    --fh: 'Press Start 2P',monospace;
    --rad: 8px;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,body {
    margin: 0;
    height: 100%;
    background: #8f8878;
    font: 15px/1.4 var(--fb);
    color: var(--dk);
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
    touch-action: manipulation;
}

.px {
    font-family: var(--fh);
}

#app {
    position: relative;
    height: 100%;
    max-width: 430px;
    margin: 0 auto;
    background: var(--case);
    overflow: hidden;
    box-shadow: 0 0 0 3px var(--dk);
}

.scr {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
}

.scr.on {
    display: flex;
}

#menu {
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
}

.logo {
    text-align: center;
    margin-bottom: 26px;
}

.logo h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.35;
    font-weight: 400;
    letter-spacing: 1px;
}

.logo small {
    display: block;
    margin-top: 12px;
    font-size: 10px;
    color: #5d5748;
}

.key {
    width: 100%;
    max-width: 300px;
    font: inherit;
    font-size: 12px;
    padding: 16px 10px;
    background: #efe9d7;
    color: var(--dk);
    border: 3px solid var(--dk);
    border-radius: 10px;
    box-shadow: 0 5px 0 var(--dk);
}

.key:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--dk);
}

.key:disabled {
    opacity: .45;
}

.key.main {
    background: #f6d23c;
}

#game {
    background: var(--scr);
    color: var(--txt);
}

#hud {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 6px;
    padding: 12px;
    background: var(--deep);
    border-bottom: 3px solid var(--bd);
}

#hud div {
    font-size: 10px;
    line-height: 1.5;
}

#money {
    color: var(--mint);
    text-align: left;
    font-size: 13px!important;
}

#date {
    text-align: center;
}

#xp {
    color: var(--xp);
    text-align: right;
}

#hud small {
    display: block;
    font: 11px system-ui,sans-serif;
    color: var(--mut);
}

#up {
    min-height: 64px;
    padding: 10px 12px;
    background: var(--scr3);
    border-bottom: 3px solid var(--bd);
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.lab {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--mut2);
    margin-bottom: 6px;
    gap: 8px;
}

.bar {
    height: 6px;
    background: var(--bd2);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
}

.bar i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--mint);
}

#up .bar {
    margin-top: 0;
}

.buy {
    width: 100%;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 10px;
    background: var(--gold);
    color: var(--onGold);
    border: 3px solid var(--bd);
    border-radius: 8px;
    box-shadow: 0 4px 0 var(--bd);
    animation: pop .5s ease-out;
}

.buy:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--bd);
}

.buy small {
    display: block;
    font-weight: 400;
    font-size: 12px;
    opacity: .8;
}

.done {
    text-align: center;
    font-size: 13px;
    color: var(--xp);
}

@keyframes pop {
    from {
        transform: scale(.94);
    }
    to {
        transform: scale(1);
    }
}

#pad {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    overflow: hidden;
    touch-action: none;
    text-align: center;
    padding: 0 16px;
}

#pad:active {
    background: var(--padA);
}

#pad .big {
    font-size: 16px;
    line-height: 1.6;
    pointer-events: none;
}

#pad .sub {
    color: var(--mut);
    font-size: 13px;
    pointer-events: none;
}

#pas {
    color: var(--mint);
    font-size: 13px;
    pointer-events: none;
}

#ads {
    pointer-events: auto;
    display: flex;
    gap: 8px;
    margin-top: 12px;
    width: 100%;
    max-width: 360px;
}

.adb {
    flex: 1;
    font: inherit;
    font-weight: 700;
    font-size: 12px;
    line-height: 1.25;
    padding: 8px 4px;
    background: #7a2fa8;
    color: #fff;
    border: 2px solid var(--bd);
    border-radius: 8px;
    box-shadow: 0 3px 0 var(--bd);
}

.adb:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--bd);
}

.adb:disabled {
    opacity: .5;
}

.adb small {
    display: block;
    font-weight: 400;
    font-size: 11px;
    color: #e6d0f5;
}

#ad {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: #000e;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.adc {
    background: var(--scr2);
    border: 3px solid var(--bd);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    color: var(--ink);
    max-width: 320px;
}

#adt {
    font-size: 28px;
    margin: 14px 0;
}

.tabs {
    display: flex;
    gap: 8px;
}

.tabs button {
    flex: 1;
    padding: 10px;
    font: inherit;
    font-weight: 700;
    background: var(--btn);
    color: var(--mut2);
    border: 2px solid var(--bd);
    border-radius: 8px;
}

.tabs button.on {
    background: var(--gold);
    color: var(--onGold);
}

.tb {
    display: flex;
    gap: 6px;
    margin-top: 8px;
}

.tb button {
    flex: 1;
    font: inherit;
    font-weight: 700;
    padding: 8px 0;
    border: 2px solid var(--bd);
    border-radius: 6px;
    background: var(--mint);
    color: var(--deep);
}

.tb button.s {
    background: var(--red);
}

.tick {
    overflow: hidden;
    white-space: nowrap;
    background: var(--deep);
    border: 2px solid var(--bd);
    border-radius: 8px;
    margin-bottom: 10px;
    padding: 7px 0;
    font-size: 13px;
    color: var(--xp);
}

.tk {
    display: inline-block;
    padding-left: 100%;
    animation: tk 45s linear infinite;
}

@keyframes tk {
    to {
        transform: translateX(-100%);
    }
}

.chip {
    font-weight: 700;
    margin-left: 6px;
    font-size: 12px;
}

.chip.up {
    color: var(--mint);
}

.chip.dn {
    color: var(--red);
}

.nwb {
    position: absolute;
    right: 8px;
    top: 150px;
    z-index: 3;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid var(--bd);
    background: var(--gold);
    font-size: 22px;
    line-height: 1;
    box-shadow: 0 3px 0 var(--bd);
    padding: 0;
}

.nwb b {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 20px;
    height: 20px;
    border-radius: 10px;
    background: #e3453d;
    color: #fff;
    font: 700 11px/20px system-ui,sans-serif;
    display: none;
    padding: 0 4px;
}

.btn.s {
    background: var(--red);
}

.tb button:disabled {
    opacity: .4;
}

#ctl #bHome {
    flex: 1.3;
}

#nmo {
    position: absolute;
    inset: 0;
    z-index: 30;
    background: #000c;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.stack {
    display: flex;
    height: 14px;
    border-radius: 7px;
    overflow: hidden;
    background: var(--deep);
    margin: 10px 0;
}

.stack i {
    display: block;
    height: 100%;
}

.dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
}

.gc {
    display: flex;
    gap: 12px;
    align-items: center;
}

.ic {
    width: 110px;
    height: 86px;
    flex: none;
    background: linear-gradient(var(--scr),var(--deep));
    border-radius: 8px;
}

#pv {
    width: 100%;
    height: 230px;
    background: linear-gradient(var(--scr2),var(--deep));
    border-radius: 10px;
    border: 2px solid var(--bd);
    touch-action: pan-y;
    display: block;
    margin-bottom: 12px;
}

.tabs button {
    padding: 9px 2px;
    font-size: 13px;
}

.cl {
    display: none;
    font-size: 12px;
    color: #5d5748;
    text-align: center;
    max-width: 300px;
}

.skip {
    pointer-events: auto;
    margin-top: 14px;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    line-height: 1.35;
    padding: 10px 18px;
    background: var(--btn);
    color: #fff;
    border: 2px solid var(--bd);
    border-radius: 8px;
    box-shadow: 0 3px 0 var(--bd);
}

.skip:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--bd);
}

.skip:disabled {
    opacity: .5;
}

.skip small {
    display: block;
    font-weight: 400;
    font-size: 12px;
    color: var(--mut2);
}

.fl {
    position: absolute;
    pointer-events: none;
    color: var(--mint);
    font-family: 'Press Start 2P',monospace;
    font-size: 13px;
    transform: translate(-50%,-50%);
    animation: fly .7s ease-out forwards;
    text-shadow: 0 2px 0 var(--bd);
}

.fl.xpf {
    color: var(--xp);
}

@keyframes fly {
    to {
        opacity: 0;
        margin-top: -70px;
    }
}

#ctl {
    display: flex;
    gap: 6px;
    padding: 8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);
    background: var(--deep);
    border-top: 3px solid var(--bd);
}

#ctl button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 6px 2px;
    font: inherit;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.2;
    background: var(--btn);
    border: 2px solid var(--bd);
    border-radius: 8px;
    color: var(--mut2);
}

#ctl button i {
    font-style: normal;
    font-size: 20px;
    line-height: 1.1;
}

#ctl button.on {
    background: var(--gold);
    color: var(--onGold);
}

#toast {
    position: absolute;
    left: 12px;
    right: 12px;
    top: 78px;
    z-index: 8;
    background: #000d;
    color: #fff;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    font-size: 14px;
}

#sheet {
    position: absolute;
    left: 0;
    right: 0;
    z-index: 4;
    background: var(--scr);
    display: none;
    flex-direction: column;
}

#shB {
    flex: 1;
    overflow: auto;
    padding: 12px;
}

.card {
    background: var(--scr2);
    border: 2px solid var(--bd2);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
}

.card h3 {
    margin: 0 0 4px;
    font-size: 15px;
}

.mut {
    color: var(--mut);
    font-size: 13px;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--mut2);
    margin-top: 6px;
}

.btn {
    font: inherit;
    font-weight: 700;
    padding: 9px 12px;
    background: var(--gold);
    color: var(--onGold);
    border: 2px solid var(--bd);
    border-radius: 6px;
}

.btn:disabled {
    background: #8d93b5;
    color: #4d5273;
}

.btn.w {
    background: var(--wbtn);
}

.nm {
    width: 100%;
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 2px dashed var(--mut);
    padding: 2px 0;
    margin-bottom: 2px;
}

input.nm:focus {
    outline: 0;
    border-bottom-color: var(--gold);
}

.empty {
    text-align: center;
    color: var(--mut);
    padding: 30px 10px;
}

#money {
    color: var(--mintd);
}

#xp {
    color: var(--xpd);
}

.tick,.done {
    color: var(--xpd);
}

.tick .chip.up,.tick .pos {
    color: var(--mintd);
}

.tick .chip.dn,.tick .neg {
    color: var(--redd);
}

#hud,#up,#ctl {
    color: var(--inkd);
}

#hud small {
    color: var(--inkd);
    opacity: .7;
}

#up .lab {
    color: var(--inkd);
}

#ctl button,.tabs button {
    color: var(--inkd);
}

.tabs button.on,#ctl button.on {
    color: var(--onGold);
}

.btn.w {
    color: var(--ink);
}

.btn.s {
    color: var(--onGold);
}

.card,.tick,.tabs button,#ctl button,.skip,.adb,.buy {
    border-radius: var(--rad);
}

.btn,.tb button {
    border-radius: calc(var(--rad)*.75);
}

.tabs {
    overflow-x: auto;
    scrollbar-width: none;
}

.tabs button {
    flex: 1 0 auto;
    font-size: 13px;
    padding: 9px 12px;
    white-space: nowrap;
}

.skip small {
    color: var(--inkd);
    opacity: .85;
}

.pos {
    color: var(--mint);
    font-weight: 700;
}

.neg {
    color: var(--red);
    font-weight: 700;
}

.pic {
    width: 100%;
    height: 150px;
    border-radius: 8px;
    display: block;
    background: linear-gradient(#8ec5f0 0,#dff1ff 52%,#7fbf6a 52%,#5f9f4f 100%);
}

.pic[data-art=island] {
    background: linear-gradient(#8ec5f0 0,#dff1ff 45%,#2f8fd9 45%,#1c6fb5 100%);
}

.aic {
    width: 64px;
    height: 64px;
    flex: none;
    border-radius: 12px;
    background: var(--deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
}

.pcl {
    display: block;
    margin: 0 auto;
}

    --gold: #ff5722;
    --onGold: #ffffff;
    --mint: #00875a;
    --xp: #b26a00;

    --bd2: #cfd8dc;
    --padA: #e3e8eb;

    --fb: Roboto,'Segoe UI',system-ui,sans-serif;

/* ---- разработки: слоты, копии, видео-ускорение у каждой ---- */
const slots = () => S.slots || 10;

function renderNew() {

function ask(i) {

function start() {

async function watchUp(k) {

function renderMine() {

  <div class="row"><span>Уровень ${l}/10</span><b style="color:var(--mint)">${fm(inc(v.t, l) * dmult(v.t) * dupF(v))} / мес</b></div>
      <div class="row"><span class="mut">Следующая выплата</span><span class="mut">${ds(nextPay())}</span></div>${evl(v)}${a}<div
          class="row"><span></span><button class="btn w" onclick="closeDev(${k})">Закрыть</button></div></div>`;
    }).join('');
}
/* ---- нажатия, автокликер, защита ---- */
const tapNow = () => tapv(S.lvl) * (1 + skinB('tap') / 100) * (1 + reB('tap') / 100);
let tc = 0, tn = Math.floor(7 + Math.random() * 14), TT = [], blockUntil = 0, viol = 0, lastTapT = 0;
function doTap(e, auto) {
    const v = tapNow();
    earn(v, 'tap');
    S.taps = (S.taps || 0) + 1;
    qEv('tap');
    S.xpf = (S.xpf || 0) + .1;
    if (S.xpf >= 1) {
        const w = Math.floor(S.xpf);
        S.xp += w;
        S.xpf -= w;
    }
    if (e)
        fl(e, '+' + fm(v));
    if (++tc >= tn) {
        tc = 0;
        tn = Math.floor(7 + Math.random() * 14);
        const x = Math.floor(2 + Math.random() * 11);
        S.xp += x;
        if (e) {
            const cx = e.clientX, cy = e.clientY - 34;
            setTimeout(() => fl({ clientX: cx, clientY: cy }, '+' + x + ' XP', 'xpf'), 120);
        }
    }
    head();
    renderUp();
    saveSoon();
}
$('pad').addEventListener('pointerdown', e => {
    if (!S)
        return;
    e.preventDefault();
    if (!e.isTrusted)
        return;
    const now = performance.now();
    if (now < blockUntil)
        return;
    if (now - lastTapT < 18)
        return;
    lastTapT = now;
    TT.push(now);
    if (TT.length > 24)
        TT.shift();
    if (TT.length >= 24) {
        const d = [];
        for (let i = 1; i < TT.length; i++)
            d.push(TT[i] - TT[i - 1]);
        const mean = d.reduce((a, b) => a + b, 0) / d.length, sd = Math.sqrt(d.reduce((a, b) => a + (b - mean) * (b - mean), 0) / d.length);
        if (mean < 18 || (mean < 220 && sd < 3.5)) {
            viol++;
            const sec = Math.min(60, 8 * viol);
            blockUntil = now + sec * 1000;
            TT = [];
            toast('🚫 Похоже на автокликер. Нажатия заблокированы на ' + sec + ' с', -1);
            return;
        }
    }
    doTap(e, false);
});
/* ---- время: месяц, офлайн, пропуск года, реклама ---- */
function month() {
    if (!SKIP) {

    lifeStep();

            S.xp += (4 + 2 * v.lvl) * (1 + skinB('xp') / 100);

            if (v.up.left <= 0) {

}
function catchUp() {
    const el = Date.now() - S.at, raw = Math.floor(el / dm());
    if (raw > 5) {
        const g = (passive() + divs() + rentSum()) * Math.min(el, 28800000) / 30000 * .5;
        lastOff += earn(g, 'dev');
        S.at = Date.now();
        return 0;
    }
    if (raw <= 0)
        return 0;
    for (let i = 0; i < raw; i++)
        day();
    S.at += raw * dm();
    return raw;
}
function skipYear(free) {
    if (!S)
        return;
    catchUp();
    const c = free === 1 ? { m: 0, x: 0 } : skipCost();
    if (S.money < c.m || S.xp < c.x)
        return;
    S.money -= c.m;
    S.xp -= c.x;
    const d = new Date(S.d), t = Date.UTC(d.getUTCFullYear() + 1, d.getUTCMonth(), d.getUTCDate());
    SKIP = 1;
    try {
        while (S.d < t)
            day();
    }

        SKIP = 0;
    }
    S.skips = (S.skips || 0) + 1;

async function watch(id) {

function step() {
